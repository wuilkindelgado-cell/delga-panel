<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Delga Grabar</title>
<meta name="theme-color" content="#070b17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delga Grabar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<style>
:root{--fondo:#070b17;--capa:#0e1528;--capa2:#151f3a;--borde:#24315a;--texto:#eef3ff;--suave:#8f9cc0;--cian:#00e5ff;--verde:#2ee66b;--rojo:#ff4d6d;--oro:#ffc400;--violeta:#9b7bff;--radio:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px)}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
header h1{font-size:22px;margin:0;flex:1}
header small{display:block;color:var(--suave);font-size:12px;font-weight:400}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.icobtn{background:var(--capa2);border:1px solid var(--borde);width:42px;height:42px;border-radius:12px;font-size:18px}
.card{background:var(--capa);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;margin:12px 0}
.guion{display:block;width:100%;text-align:left}
.guion .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.chip.Delgatronics{background:rgba(0,229,255,.15);color:var(--cian)}
.chip.Delgafutbol{background:rgba(46,230,107,.15);color:var(--verde)}
.guion b{display:block;font-size:18px;line-height:1.25}
.guion span.t{display:block;color:var(--suave);font-size:13px;margin-top:6px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(90deg,#00b8d4,#7a5cff);font-weight:700;font-size:17px;text-align:center}
.btn.sec{background:var(--capa2);border:1px solid var(--borde)}
.btn.rojo{background:var(--rojo)}
.btn.verde{background:var(--verde);color:#04210f}
input[type=text],input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--borde);background:var(--capa2);color:var(--texto);font-size:16px}
.vacio{color:var(--suave);text-align:center;padding:30px 10px;line-height:1.5}
.oculto{display:none!important}
/* teleprompter */
#prompter{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:10}
#prompter .barra{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#05070f;border-bottom:1px solid #1a2242}
#prompter .barra .t{flex:1;font-size:13px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#texto{flex:1;overflow-y:auto;padding:30vh 22px 60vh;font-size:var(--tam,30px);line-height:1.45;font-weight:600;scroll-behavior:auto}
#texto p{margin:0 0 1.1em}
#texto strong{color:var(--oro)}
#texto .p1{color:#3d6bff;font-weight:800}
#texto .p2{display:block;height:.55em}
#guia{position:fixed;left:0;right:0;top:30vh;height:3px;background:rgba(255,77,109,.5);pointer-events:none}
#controles{background:#05070f;border-top:1px solid #1a2242;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px)}
.fila{display:flex;gap:10px;align-items:center}
.fila+.fila{margin-top:10px}
.mini{background:#151f3a;border:1px solid #24315a;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700}
#rec{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;margin:0 auto}
#rec i{display:block;width:58px;height:58px;border-radius:50%;background:var(--rojo);transition:all .2s}
#rec.on i{width:30px;height:30px;border-radius:6px}
#reloj{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;min-width:70px;text-align:center}
#reloj.on{color:var(--rojo)}
#vel{flex:1}
audio{width:100%;margin:8px 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:#1c2848;border:1px solid var(--borde);padding:14px;border-radius:14px;text-align:center;font-weight:600;z-index:50;transition:opacity .3s}
.ok{color:var(--verde)}
</style>
</head>
<body>
<header>
  <h1>🎙️ Delga Grabar<small id="sub">Guiones pendientes</small></h1>
  <button class="icobtn" id="recargar" aria-label="Actualizar">↻</button>
</header>

<section id="config" class="oculto">
  <div class="card">
    <b>Conectar con la PC</b>
    <p style="color:var(--suave);font-size:14px;line-height:1.5">Pega el token del buzón (empieza con <code>github_pat_</code>). Se guarda solo en este celular.</p>
    <input type="password" id="token" placeholder="github_pat_…" autocomplete="off">
    <div style="height:12px"></div>
    <button class="btn" id="guardarToken">Conectar</button>
    <p id="errToken" style="color:var(--rojo);font-size:14px"></p>
  </div>
</section>

<section id="lista"></section>

<section id="extra" class="oculto">
  <div class="card">
    <b>📎 ¿Grabaste con Notas de Voz?</b>
    <p style="color:var(--suave);font-size:14px;margin:6px 0 12px">Abre un guion y toca «Subir archivo». O envíalo aquí sin guion y lo dejo en <i>_entrada</i>.</p>
    <button class="btn sec" id="subirSuelto">Subir audio suelto</button>
  </div>
  <p style="text-align:center"><button class="mini" id="desconectar" style="background:none;border:0;color:var(--suave);font-weight:400">Desconectar este celular</button></p>
</section>

<div id="prompter" class="oculto">
  <div class="barra">
    <button class="mini" id="cerrar">✕</button>
    <div class="t" id="pTitulo"></div>
    <button class="mini" id="menos">A−</button><button class="mini" id="mas">A+</button>
  </div>
  <div id="texto"></div>
  <div id="guia"></div>
  <div id="controles">
    <div id="modoGrabar">
      <div class="fila">
        <span style="font-size:13px;color:var(--suave)">Avance</span>
        <input type="range" id="vel" min="0" max="10" step="1" value="3">
        <button class="mini" id="arriba">⤒</button>
      </div>
      <div class="fila" style="margin-top:12px">
        <div id="reloj">0:00</div>
        <button id="rec" aria-label="Grabar"><i></i></button>
        <button class="mini" id="subirArchivo" style="min-width:70px">📎 Archivo</button>
      </div>
    </div>
    <div id="modoRevisar" class="oculto">
      <audio id="escucha" controls playsinline></audio>
      <div class="fila">
        <button class="btn sec" id="repetir" style="flex:1">↺ Repetir</button>
        <button class="btn verde" id="enviar" style="flex:2">Enviar a la PC ➜</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="archivo" accept="audio/*,video/*,.m4a,.mp3,.wav,.caf" class="oculto">
<div id="toast" class="oculto"></div>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delga Panel</title>
<meta name="theme-color" content="#070d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delga Panel">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="icon" href="iconos/icono-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --fondo:#070d1c; --panel:#0f1830; --panel2:#152142; --borde:#22305a; --texto:#eef3ff; --suave:#93a3c8;
  --cian:#00e5ff; --verde:#2ee66b; --rojo:#ff4d6d; --oro:#ffc400; --rosa:#ff4fa3;
  --yt:#ff0033; --tt:#25f4ee;
  --sa-top:env(safe-area-inset-top); --sa-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:calc(var(--sa-top) + 8px) 16px calc(var(--sa-bot) + 86px)}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.oculto{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}

/* bloqueo */
#bloqueo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:radial-gradient(circle at 50% 35%,#16264f,var(--fondo) 70%);z-index:20}
#bloqueo img{width:110px;height:110px;border-radius:26px;box-shadow:0 10px 40px #00e5ff33}
#bloqueo input{width:100%;max-width:320px;padding:14px 16px;border-radius:14px;border:1px solid var(--borde);background:var(--panel);color:var(--texto);font-size:17px;text-align:center}
#bloqueo .btn{width:100%;max-width:320px}
.btn{background:var(--cian);color:#00131a;font-weight:700;padding:14px;border-radius:14px}
#errorClave{color:var(--rojo);min-height:20px;font-size:14px}

/* cabecera */
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
header h1{font-size:26px}
header small{display:block;color:var(--suave);font-size:12px;font-weight:500}
#refrescar{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:20px}
#refrescar.girando{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

.tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#132552,#0e1a38);}
.hero .grande{font-size:42px;font-weight:800;line-height:1.05}
.etq{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fila{display:flex;gap:10px}
.fila>*{flex:1}
.kpi{background:var(--panel2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.delta{font-size:13px;font-weight:700}
.sube{color:var(--verde)} .baja{color:var(--rojo)} .igual{color:var(--suave)}

.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.canal{background:var(--panel);border:1px solid var(--borde);border-radius:16px;padding:12px;position:relative;overflow:hidden}
.canal::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.canal .cab{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.canal .seg{font-size:24px;font-weight:800;margin-top:6px}
.canal .mini{color:var(--suave);font-size:12px}
.canal.apagado{opacity:.6}
.plat{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:10px;font-weight:900;flex:none}
.plat.youtube{background:var(--yt);color:#fff}
.plat.tiktok{background:#000;color:#fff;box-shadow:-1px -1px 0 var(--tt),1px 1px 0 var(--rosa)}

svg.graf{width:100%;height:auto;display:block}
.leyenda{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--suave);margin-top:8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--borde);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--texto);color:var(--fondo)}

.video{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde)}
.video:last-child{border:0}
.video img{width:54px;height:96px;object-fit:cover;border-radius:8px;background:var(--panel2);flex:none}
.video .t{font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video .m{color:var(--suave);font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}
.video .m b{color:var(--texto)}
.badge{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#2ee66b22;color:var(--verde)}

.consejo{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--borde);margin-bottom:8px}
.consejo .p{width:8px;border-radius:4px;flex:none}
.consejo small{color:var(--suave);font-weight:600;font-size:12px}
.p1{background:var(--rojo)}.p2{background:var(--oro)}.p3{background:var(--verde)}

.lista-barras .fb{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.lista-barras .fb span:first-child{width:96px;color:var(--suave);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-barras .bar{height:8px;border-radius:4px;background:var(--cian)}
.coment{padding:8px 0;border-bottom:1px solid var(--borde);font-size:13px}
.coment b{font-size:12px;color:var(--suave)}
.aviso{background:#ffc40018;border:1px solid #ffc40055;color:#ffe08a;border-radius:14px;padding:12px;font-size:13px;margin-bottom:12px}
.vacio{color:var(--suave);text-align:center;padding:24px 8px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,16,34,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--borde);padding:6px 6px calc(var(--sa-bot) + 6px);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--suave);padding:6px 0}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--cian)}
</style>
</head>
<body>
<div id="bloqueo">
  <img src="iconos/icono-192.png" alt="">
  <h2>Delga Panel</h2>
  <div style="color:var(--suave);text-align:center;max-width:300px">Métricas de Delgatronics y Delgafutbol en YouTube y TikTok</div>
  <input id="clave" type="password" placeholder="Clave del panel" autocomplete="current-password" autocapitalize="off" autocorrect="off">
  <button class="btn" id="entrar">Entrar</button>
  <div id="errorClave"></div>
</div>

<header>
  <div><h1 id="titulo">Resumen</h1><small id="actualizado"></small></div>
  <button id="refrescar" aria-label="Actualizar">↻</button>
</header>
<main id="vista"></main>

<nav>
  <button data-tab="resumen" class="on"><span class="i">◎</span>Resumen</button>
  <button data-tab="canal"><span class="i">▤</span>Canales</button>
  <button data-tab="videos"><span class="i">▶</span>Videos</button>
  <button data-tab="consejos"><span class="i">✦</span>Consejos</button>
</nav>
<script src="app.js"></script>
</body>
</html>
